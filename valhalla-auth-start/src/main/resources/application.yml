spring:
  application:
    name: valhalla-auth
  profiles:
    active: local
  config:
    import:
      # 导入 Dubbo 配置（不可刷新，优先加载）
      - optional:classpath:bootstrap-dubbo.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# Token 生命周期配置
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
  token:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-sessions: 5
  password:
    lock-threshold: 5
    lock-duration: 30m

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    # 降低 Nacos 配置刷新相关日志级别，减少日志输出
    com.alibaba.nacos: WARN
    com.alibaba.cloud.nacos: WARN
    org.apache.dubbo: WARN